name: Bug report
description: A formula or cask in this tap fails to install, upgrade, uninstall, or launch.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This form is public. Do not include secrets, credentials, or personal data.

        A bug in the packaged software itself belongs in that project's repository ([AttackMap](https://github.com/mlaify/AttackMap/issues), [grrclone](https://github.com/mlaify/grrclone/issues)). A vulnerability in this tap must be reported privately from the repository's **Security** tab.
  - type: dropdown
    id: package
    attributes:
      label: Formula or cask
      options:
        - attackmap (formula)
        - attackmap-app (cask)
        - grrclone (cask)
        - Other
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Problem
      options:
        - Install fails
        - Upgrade fails
        - Uninstall or cleanup problem
        - Installs but does not launch or run
        - Checksum mismatch or wrong version
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: What you ran
      placeholder: brew install --cask mlaify/tap/grrclone
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What went wrong
      description: Paste the failing command output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: brew-config
    attributes:
      label: brew config
      description: Paste the output of `brew config`. It includes the Homebrew, macOS, and CPU details.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing open and closed issues for this problem.
          required: true
        - label: I ran `brew update` and the problem still happens.
          required: true
        - label: This report does not contain secrets, credentials, or personal data.
          required: true
