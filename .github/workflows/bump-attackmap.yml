name: Bump attackmap formula

# Opens a PR that moves Formula/attackmap.rb to the newest AttackMap tag.
# Triggers: daily check, manual run, or a repository_dispatch from AttackMap's
# own tag workflow:
#   gh api repos/mlaify/homebrew-tap/dispatches \
#     -f event_type=attackmap-release -F client_payload[version]=0.4.32

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "AttackMap version (default: newest v* tag)"
        required: false
  repository_dispatch:
    types: [attackmap-release]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-attackmap
  cancel-in-progress: false

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Homebrew (taps this checkout as mlaify/tap)
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Work out the target version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
        run: |
          set -euo pipefail
          latest="${INPUT_VERSION#v}"
          if [ -z "$latest" ]; then
            latest="$(git ls-remote --tags --refs https://github.com/mlaify/AttackMap.git 'v*' \
              | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+(\.[0-9]+)+$' | sort -V | tail -1)"
          fi
          if ! [[ "$latest" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "bad version: $latest" >&2; exit 1
          fi
          current="$(sed -nE 's#^  url ".*/v([0-9.]+)\.tar\.gz"$#\1#p' Formula/attackmap.rb | head -1)"
          echo "current=$current latest=$latest"
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rewrite the formula
        if: steps.ver.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}  # validated above
        run: scripts/bump_attackmap.sh "$VERSION"

      - name: Install and test from source
        if: steps.ver.outputs.skip != 'true'
        run: |
          brew install --build-from-source mlaify/tap/attackmap
          brew test mlaify/tap/attackmap

      - name: Open the PR
        if: steps.ver.outputs.skip != 'true'
        env:
          # A PAT/App token lets the PR trigger test.yml; PRs opened with
          # GITHUB_TOKEN do not start other workflows.
          GH_TOKEN: ${{ secrets.TAP_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          branch="attackmap-${VERSION}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "branch $branch already exists; nothing to do"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Formula/attackmap.rb
          git commit -m "attackmap ${VERSION}"
          git push -u origin "$branch"
          gh pr create --head "$branch" --title "attackmap ${VERSION}" \
            --body "Automated bump of \`Formula/attackmap.rb\` to AttackMap v${VERSION}: tag tarball sha256, PyPI resources (\`brew update-python-resources\`), and analyzer plugins pinned from \`plugins_lock.py\` at the tag."
